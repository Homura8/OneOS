name: Experimental S22+ debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/s22plus-snapdragon-oxygenos

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_PACKAGES_USER: ${{ vars.GH_PACKAGES_USER || github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --channel=3 --install 'platforms;android-37.0' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check model and root-script tests
        working-directory: app-android
        run: ./gradlew :core:model:test :core:root:test --no-daemon --max-workers=2
      - name: Stage debug guest manager
        run: ./scripts/build-guest-manager.sh debug
      - name: Build experimental OneOS app
        working-directory: app-android
        run: ./gradlew :app:assembleFullDebug --no-daemon --max-workers=2
      - name: Upload unsigned-for-release test build (debug signed)
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-S22Plus-Snapdragon-EXPERIMENTAL-debug
          path: app-android/app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
          retention-days: 7
